name: Build Starfait

on:
  push:
    branches: [main]

jobs:
  build:
    name: Starfait Runner (SDL3) (${{ matrix.label }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Linux x64"
            lwjglNativesPlatform: "natives-linux"
          - label: "Windows x64"
            lwjglNativesPlatform: "natives-windows"
          - label: "macOS x64"
            lwjglNativesPlatform: "natives-macos"
          - label: "FreeBSD x64"
            lwjglNativesPlatform: "natives-freebsd"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "27"
          cache: "gradle"

      - name: Build
        env:
          # GitHub Actions has 7GBs of available RAM for workers, so let's bump it a bit up!
          GRADLE_OPTS: -Xmx4096m -Xms4096m
        run: ./gradlew build gameTest :starfait-runner-sdl3:installDist -PlwjglNativesPlatform=${{ matrix.lwjglNativesPlatform }} --no-daemon

      - name: Upload Starfait distribution
        uses: actions/upload-artifact@v4
        with:
          name: Starfait ${{ matrix.label }}
          path: starfait-runner-sdl3/build/install/Starfait/starfait-runner-sdl3
          if-no-files-found: error